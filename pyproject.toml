[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-bands-reference"
version = "0.2.0"
description = "Reference API and deployment stack for the Guard Bands boundary library."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "guard-bands[fastapi,mcp] @ git+https://github.com/Cryptix-Security/guard-bands.git@v0.9.0",
  "anthropic==0.121.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "slowapi==0.1.10",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
# Optional secrets backends — installed only when needed so the base image
# stays light. Use SECRETS_BACKEND=aws|vault to activate.
aws = [
  "boto3>=1.34,<2",
]
vault = [
  "hvac>=2.1,<3",
]
# Benchmark harness (AgentDojo). Optional and heavy — install only to run the
# real prompt-injection benchmark: pip install 'guard-bands-reference[bench]'.
bench = [
  "agentdojo>=0.1.30",
]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.165.4",
]

[project.urls]
Homepage = "https://guardbands.com/"
Repository = "https://github.com/Cryptix-Security/guard-bands-reference"
Issues = "https://github.com/Cryptix-Security/guard-bands-reference/issues"
Core = "https://github.com/Cryptix-Security/guard-bands"

[tool.setuptools.packages.find]
include = [
  "app*",
  "dual_channel*",
  "guardbands_sdk*",
  "integrations*",
  "reference_app*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
