[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-bands-reference"
version = "0.2.0"
description = "Reference API and deployment stack for the Guard Bands boundary library."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "guard-bands[fastapi,mcp] @ git+https://github.com/Cryptix-Security/guard-bands.git@v0.10.0",
  "anthropic==0.120.2",
  "asyncpg==0.31.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "slowapi==0.1.10",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
# Optional secrets backends — installed only when needed so the base image
# stays light. Use SECRETS_BACKEND=aws|vault to activate.
aws = [
  "boto3>=1.34,<2",
]
vault = [
  "hvac>=2.1,<3",
]
# Benchmark harness (AgentDojo). Optional and heavy — install only to run the
# real prompt-injection benchmark: pip install 'guard-bands-reference[bench]'.
bench = [
  "agentdojo>=0.1.30",
]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.165.0",
  "mypy==1.20.2",
  "ruff==0.17.6",
]

[project.urls]
Homepage = "https://guardbands.com/"
Repository = "https://github.com/Cryptix-Security/guard-bands-reference"
Issues = "https://github.com/Cryptix-Security/guard-bands-reference/issues"
Core = "https://github.com/Cryptix-Security/guard-bands"

[tool.setuptools.packages.find]
include = [
  "app*",
  "dual_channel*",
  "guardbands_sdk*",
  "integrations*",
  "reference_app*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once at import time by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Demo scripts put the repo root on sys.path before importing app code.
"scripts/*" = ["E402"]
# Long lines here are LLM prompt text and attack fixtures; wrapping them would
# change the strings the model or parser sees.
"app/llm.py" = ["E501"]
"demo_llm_attack.py" = ["E501"]
"scripts/redteam_control_plane.py" = ["E402", "E501"]
# Public SDK exception names; renaming them would break callers.
"guardbands_sdk/errors.py" = ["N818"]
# These signatures mirror AgentDojo's BasePipelineElement.query and must match it.
"integrations/agentdojo/*" = ["B006", "B008"]
"scripts/run_agentdojo_benchmark.py" = ["E402", "B006", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
# Strict baseline for the security-sensitive request path. Widen this list as
# other modules are typed.
files = [
  "app/audit.py",
  "app/authorization.py",
  "app/config.py",
  "app/cost.py",
  "app/llm.py",
  "app/middleware/auth.py",
  "app/replay.py",
  "app/secrets_provider.py",
]

[[tool.mypy.overrides]]
# Optional secrets-manager SDKs, installed only with the aws/vault extras.
module = ["boto3", "boto3.*", "hvac", "hvac.*"]
ignore_missing_imports = true
